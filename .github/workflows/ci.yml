name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: npm test
      - name: honesty checks
        run: npm run check
      - name: sample doctor
        run: npm run doctor -- --file real-events.json
